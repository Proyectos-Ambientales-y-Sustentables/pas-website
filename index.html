<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proyectos Ambientales y Sustentables — Próximamente</title>
<meta name="description" content="El nuevo sitio de Proyectos Ambientales y Sustentables (PAS) está en construcción. Vuelve pronto.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg-top:#0F1F17;
    --bg-bottom:#182C20;
    --moss:#3E5C40;
    --moss-dark:#1B2E1B;
    --sage:#9FB98C;
    --sand:#EFE8D8;
    --sand-dim:#AFA68F;
    --gold:#C9A227;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; padding:0; }

  body{
    min-height:100vh;
    font-family:'Work Sans', sans-serif;
    background:linear-gradient(to bottom, var(--bg-top), var(--bg-bottom) 72%);
    color:var(--sand);
    overflow-x:hidden;
  }

  .scene{
    position:relative;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:9vh 6vw;
    overflow:hidden;
  }

  /* ---------- fondo: colinas y luz de amanecer ---------- */
  .hills{
    position:absolute;
    left:0; bottom:0;
    width:100%;
    height:26vh;
    min-height:180px;
    z-index:0;
    pointer-events:none;
  }

  /* ---------- enredadera que crece (elemento firma) ---------- */
  .vine{
    position:absolute;
    right:3vw;
    bottom:0;
    height:100%;
    width:auto;
    max-width:190px;
    z-index:0;
    opacity:0.5;
    pointer-events:none;
  }
  .vine .stem{
    fill:none;
    stroke:var(--moss);
    stroke-width:3;
    stroke-linecap:round;
    stroke-dasharray:1600;
    stroke-dashoffset:1600;
    animation:grow 2.6s cubic-bezier(.65,0,.35,1) .25s forwards;
  }
  .vine .leaf{
    fill:var(--sage);
    opacity:0;
    transform-box:fill-box;
    transform-origin:center;
    animation:leafIn .7s ease forwards;
  }

  @keyframes grow{ to{ stroke-dashoffset:0; } }
  @keyframes leafIn{
    from{ opacity:0; transform:scale(.35) rotate(-10deg); }
    to{ opacity:.85; transform:scale(1) rotate(0deg); }
  }

  /* ---------- motas ambientales ---------- */
  .motes{
    position:absolute; inset:0;
    z-index:1;
    overflow:hidden;
    pointer-events:none;
  }
  .mote{
    position:absolute;
    bottom:-4vh;
    left:var(--x);
    width:var(--size); height:var(--size);
    border-radius:50%;
    background:var(--sage);
    opacity:0;
    filter:blur(.2px);
    animation:float var(--dur) linear var(--delay) infinite;
  }
  @keyframes float{
    0%{ transform:translate(0,0); opacity:0; }
    10%{ opacity:.45; }
    50%{ transform:translate(6px,-52vh); opacity:.3; }
    90%{ opacity:.12; }
    100%{ transform:translate(-6px,-100vh); opacity:0; }
  }

  /* ---------- marca ---------- */
  .mark{
    position:absolute;
    top:5.5vh; left:6vw;
    z-index:2;
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:1.05rem;
    letter-spacing:.03em;
    color:var(--sand);
  }

  /* ---------- contenido principal ---------- */
  .hero{
    position:relative;
    z-index:2;
    max-width:640px;
    text-align:center;
  }
  .hero::before{
    content:"";
    position:absolute;
    left:50%; top:45%;
    width:520px; height:340px;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(201,162,39,.22), transparent 68%);
    filter:blur(6px);
    z-index:-1;
    animation:glow 8s ease-in-out infinite;
  }
  @keyframes glow{
    0%,100%{ opacity:.55; }
    50%{ opacity:.95; }
  }

  .headline{
    font-family:'Fraunces', serif;
    font-weight:400;
    line-height:1.05;
    margin:0 0 1.5rem;
    opacity:0;
    transform:translateY(16px);
    animation:rise 1.1s cubic-bezier(.22,1,.36,1) .3s forwards;
  }
  .headline .line1{
    display:block;
    font-size:clamp(2.1rem, 6vw, 4rem);
    color:var(--sand);
  }
  .headline .line2{
    display:block;
    font-style:italic;
    font-size:clamp(2.1rem, 6vw, 4rem);
    color:var(--sage);
    margin-top:.05em;
  }

  .subtext{
    font-weight:300;
    font-size:clamp(1rem, 1.6vw, 1.12rem);
    line-height:1.65;
    color:var(--sand-dim);
    max-width:34em;
    margin:0 auto 1.6rem;
    opacity:0;
    transform:translateY(16px);
    animation:rise 1.1s cubic-bezier(.22,1,.36,1) .55s forwards;
  }

  .accent{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:500;
    font-size:1.05rem;
    color:var(--gold);
    margin:0;
    opacity:0;
    transform:translateY(16px);
    animation:rise 1.1s cubic-bezier(.22,1,.36,1) .8s forwards;
  }

  @keyframes rise{ to{ opacity:1; transform:translateY(0); } }

  /* ---------- pie ---------- */
  .site-footer{
    position:absolute;
    bottom:4vh; left:6vw;
    z-index:2;
    font-weight:300;
    font-size:.8rem;
    line-height:1.6;
    color:var(--sand-dim);
    opacity:.75;
  }
  .site-footer p{ margin:0; }

  /* ---------- responsive ---------- */
  @media (max-width:700px){
    .vine{ display:none; }
    .scene{ padding:8vh 7vw; }
    .site-footer{ left:7vw; }
  }

  /* ---------- accesibilidad: movimiento reducido ---------- */
  @media (prefers-reduced-motion: reduce){
    .vine .stem{ animation:none; stroke-dashoffset:0; }
    .vine .leaf{ animation:none; opacity:.85; }
    .headline, .subtext, .accent{ animation:none; opacity:1; transform:none; }
    .hero::before{ animation:none; opacity:.7; }
    .motes{ display:none; }
  }
</style>
</head>
<body>

<div class="scene">

  <!-- colinas y luz de fondo -->
  <svg class="hills" viewBox="0 0 1440 320" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <radialGradient id="dawn" cx="50%" cy="35%" r="60%">
        <stop offset="0%" stop-color="#C9A227" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#C9A227" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <ellipse cx="720" cy="170" rx="520" ry="150" fill="url(#dawn)"/>
    <path d="M0,180 C240,120 360,200 600,150 C840,100 960,180 1200,140 C1320,120 1400,150 1440,140 L1440,320 L0,320 Z" fill="#3E5C40" opacity="0.45"/>
    <path d="M0,220 C200,260 380,190 620,230 C860,270 1000,200 1220,240 C1340,260 1400,230 1440,240 L1440,320 L0,320 Z" fill="#1B2E1B" opacity="0.85"/>
  </svg>

  <!-- enredadera animada -->
  <svg class="vine" viewBox="0 0 200 900" aria-hidden="true">
    <path class="stem" d="M100,900 C55,820 145,760 95,690 C50,630 150,580 100,500 C55,440 150,390 95,320 C50,260 145,220 100,150 C60,100 130,60 100,10"/>

    <path class="leaf" style="animation-delay:1.0s" fill="var(--sage)" transform="translate(95,690) rotate(-30) scale(0.9)" d="M0,0 C7,-15 20,-15 25,0 C20,15 7,15 0,0 Z"/>
    <path class="leaf" style="animation-delay:1.3s" fill="var(--sage)" transform="translate(150,580) rotate(35) scale(0.8)" d="M0,0 C7,-15 20,-15 25,0 C20,15 7,15 0,0 Z"/>
    <path class="leaf" style="animation-delay:1.6s" fill="var(--sage)" transform="translate(100,500) rotate(-25) scale(1)" d="M0,0 C7,-15 20,-15 25,0 C20,15 7,15 0,0 Z"/>
    <path class="leaf" style="animation-delay:1.9s" fill="var(--sage)" transform="translate(95,320) rotate(30) scale(0.85)" d="M0,0 C7,-15 20,-15 25,0 C20,15 7,15 0,0 Z"/>
    <path class="leaf" style="animation-delay:2.15s" fill="var(--sage)" transform="translate(145,220) rotate(-35) scale(0.75)" d="M0,0 C7,-15 20,-15 25,0 C20,15 7,15 0,0 Z"/>
    <path class="leaf" style="animation-delay:2.4s" fill="var(--sage)" transform="translate(100,150) rotate(25) scale(0.9)" d="M0,0 C7,-15 20,-15 25,0 C20,15 7,15 0,0 Z"/>
    <path class="leaf" style="animation-delay:2.6s" fill="var(--sage)" transform="translate(100,10) rotate(-20) scale(0.7)" d="M0,0 C7,-15 20,-15 25,0 C20,15 7,15 0,0 Z"/>
  </svg>

  <!-- motas ambientales, generadas por JS -->
  <div class="motes" id="motes"></div>

  <header class="mark">PAS</header>

  <main class="hero">
    <h1 class="headline">
      <span class="line1">Algo nuevo</span>
      <span class="line2">está creciendo</span>
    </h1>
    <p class="subtext">
      Proyectos Ambientales y Sustentables prepara un espacio digital nuevo,
      con la misma dedicación que ponemos en cada proyecto en campo.
    </p>
    <p class="accent">Vuelve pronto.</p>
  </main>

  <footer class="site-footer">
    <p>Sitio en construcción</p>
    <p>© 2026 Proyectos Ambientales y Sustentables</p>
  </footer>

</div>

<script>
  (function(){
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(reduce) return;

    var container = document.getElementById('motes');
    var count = window.innerWidth < 700 ? 7 : 12;

    for(var i=0; i<count; i++){
      var mote = document.createElement('span');
      mote.className = 'mote';
      var x = Math.random()*100;
      var size = (Math.random()*3 + 2).toFixed(1);
      var dur = (Math.random()*16 + 18).toFixed(1);
      var delay = (Math.random()*-30).toFixed(1);
      mote.style.setProperty('--x', x + '%');
      mote.style.setProperty('--size', size + 'px');
      mote.style.setProperty('--dur', dur + 's');
      mote.style.setProperty('--delay', delay + 's');
      container.appendChild(mote);
    }
  })();
</script>

</body>
</html>
